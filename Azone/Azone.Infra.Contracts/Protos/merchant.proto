syntax = "proto3";

option csharp_namespace = "Azone.Contracts.Models.Generated";

import "common/common_types.proto";
import "google/protobuf/empty.proto";

package merchant;

service Merchant {
  rpc CreateShop(CreateShopRequest) returns (ShopData);
  rpc GetShopById(common.ShopId) returns (ShopData);
  rpc GetPreviewShopById(common.ShopId) returns (ShopPreview);
  rpc UserIsAdminOfShop(OwnersActionData) returns (common.IsSuccess);
  rpc EditShopName(EditShopFieldRequest) returns (common.IsSuccess);
  rpc EditShopDescription(EditShopFieldRequest) returns (common.IsSuccess);
  rpc EditShopLogo(EditShopFieldRequest) returns (common.IsSuccess);
  rpc EditOwnerPermissions(EditOwnerPermissionList) returns (common.IsSuccess);
  rpc GetPermissionList(google.protobuf.Empty) returns (PermissionsList);
  rpc UserHavePermission(UserHavePermissionRequest) returns (common.IsSuccess);
  rpc AddOwner(OwnersActionData) returns (common.IsSuccess);
  rpc RemoveOwner(OwnersActionData) returns (common.IsSuccess);
  rpc GetOwnerList(common.ShopId) returns (Owners);
  rpc GetShopDataWithOwners(common.ShopId) returns (ShopDataWithOwners);
  rpc GetPermissionsOfOwner(OwnersActionData) returns (PermissionsList);
}

message OwnersActionData {
  common.UserId user_id = 1;
  common.ShopId shop_id = 2;
}

message Owners {
  repeated common.UserId owners = 1;
}

message EditOwnerPermissionList {
  common.ShopId shop_id = 1;
  common.UserId user_id = 2;
  Permissions new_permission = 3;
  bool permission_set = 4;
}

message UserHavePermissionRequest {
  common.UserId user_id = 1;
  common.ShopId shop_id = 2;
  Permissions permission = 3;
}

message EditShopFieldRequest {
  common.ShopId shop_id = 1;
  string new_field_value = 2;
}

message ShopPreview {
  string name = 1;
  string logo_url = 2;
}


message PermissionsList {
  repeated Permissions permissions = 1;
}

enum Permissions {
  PERMISSIONS_UNSPECIFIED = 0;
  EDIT_OWNERS_LIST = 1;
  EDIT_DESCRIPTIONS = 2;
  EDIT_LOGO = 3;
  EDIT_NAME = 4;
  EDIT_ROLES_NAME = 5;
  EDIT_ROLES_PERMISSIONS = 6;
  EDIT_PROTECTED_OWNERS = 7;
  MANAGE_PRODUCTS = 8;
}


message CreateShopRequest {
  string shop_name = 1;
}

message ShopData {
  int32 id = 1;
  string shop_name = 2;
  string shop_description = 3;
  string shop_logo_url = 4;
}

message ShopDataWithOwners {
  int32 id = 1;
  string shop_name = 2;
  string shop_description = 3;
  string shop_logo_url = 4;
  Owners owners = 5;
}

message OwnersData {
  
}