syntax = "proto3";

option csharp_namespace = "Azone.Contracts.Models.Generated";

package merchant;

service Merchant {
  rpc CreateShop(CreateShopRequest) returns (ShopData);
  rpc GetShopById(ShopId) returns (ShopData);
}

message CreateShopRequest {
  string shop_name = 1;
}

message ShopData {
  int32 id = 1;
  string shop_name = 2;
  string shop_description = 3;
}

message ShopId {
  int32 id = 1;
}