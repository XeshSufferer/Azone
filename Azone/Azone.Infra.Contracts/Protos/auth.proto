syntax = "proto3";

option csharp_namespace = "Azone.Contracts.Models.Generated";

package auth;


service Auth {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountReply);
  rpc Login(LoginRequest) returns (LoginReply);
  rpc Logout(LogoutRequest) returns (IsSuccess);
  rpc Refresh(RefreshToken) returns (TokenPair);
  rpc ChangePassword(ChangePasswordRequest) returns (IsSuccess);
  rpc GetUserData(UserIdRequest) returns (UserData);
  rpc UserExist(UserIdRequest) returns (IsSuccess);
}

message CreateAccountRequest {
  string password = 1;
  string login = 2;
}

message ChangePasswordRequest {
  string login = 1;
  string password = 2;
  string new_password = 3;
}

message UserData {
  int32 id = 1;
  
}

message UserIdRequest {
  int32 user_id = 1;
}

message IsSuccess {
  bool Success = 1;
}

message RefreshToken {
  string refresh = 1;
}

message CreateAccountReply {
  TokenPair tokens = 1;
}

message LoginRequest {
  string password = 1;
  string login = 2;
}

message LoginReply {
  TokenPair tokens = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}


message TokenPair {
  string refresh_token = 1;
  string access_token = 2;
}
